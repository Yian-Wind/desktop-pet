<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Spine Reference Render</title>
<style>
  body { margin: 0; padding: 10px; background: #222a35; color: #dfe8f5; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  h1 { text-align: center; font-size: 16px; margin: 4px 0 10px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(4, 220px); gap: 12px; justify-content: center; }
  .cell canvas { width: 220px; height: 220px; background: #dbe7f2; border-radius: 8px; display: block; }
  .cell .label { text-align: center; font-size: 12px; margin-top: 4px; color: #b9c9e2; }
  #status { text-align: center; font-size: 13px; margin-top: 8px; color: #8fd3a0; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Spine 官方运行时参考渲染 · mualani（皮肤 default / left / right）</h1>
<div class="grid" id="grid"></div>
<div id="status">loading…</div>
<script src="http://127.0.0.1:{{PORT}}/{{RUNTIME_SRC}}"></script>
<script>
const SPINE = window.spine
const PATH = 'http://127.0.0.1:{{PORT}}/packs/mualani/'
const CELL = 220
document.body.dataset.booted = '1'

const combos = [
  ['default', 'loop', 0.3], ['default', 'loop', 1.2], ['default', '抬手示意', 0.4], ['default', 'walk', 0.6],
  ['left', 'loop', 0.8], ['left', 'loop', 1.6], ['left', '抬手示意', 0.4], ['left', 'walk', 0.6],
  ['right', 'loop', 0.8], ['right', 'loop', 1.6], ['right', '抬手示意', 0.4], ['right', 'walk', 0.6]
]

function setStatus(text) {
  document.getElementById('status').textContent = text
  document.body.dataset.status = text.startsWith('error') ? 'error' : 'done'
}

function addCell(label) {
  const cell = document.createElement('div')
  cell.className = 'cell'
  const canvas = document.createElement('canvas')
  canvas.width = CELL
  canvas.height = CELL
  const text = document.createElement('div')
  text.className = 'label'
  text.textContent = label
  cell.appendChild(canvas)
  cell.appendChild(text)
  document.getElementById('grid').appendChild(cell)
  return canvas
}

async function loadAssets(context) {
  const [skeletonText, atlasText, textureBlob] = await Promise.all([
    (await fetch(PATH + 'mualani.json')).text(),
    (await fetch(PATH + 'sl.atlas')).text(),
    (await fetch(PATH + 'mlnxr.png')).blob()
  ])
  const image = await createImageBitmap(textureBlob)
  const atlas = new SPINE.TextureAtlas(atlasText)
  for (const page of atlas.pages) {
    const texture = new SPINE.GLTexture(context, image)
    texture.setFilters(page.minFilter, page.magFilter)
    page.setTexture(texture)
  }
  return new SPINE.SkeletonJson(new SPINE.AtlasAttachmentLoader(atlas))
    .readSkeletonData(skeletonText)
}

function renderCell(skeletonData, skinName, animName, t) {
  const canvas = addCell(skinName + ' · ' + animName + ' @' + t.toFixed(1) + 's')
  const cellContext = new SPINE.ManagedWebGLRenderingContext(canvas, { alpha: true, antialias: true })
  const skeleton = new SPINE.Skeleton(skeletonData)
  if (typeof skeleton.setSkinByName === 'function') skeleton.setSkinByName(skinName)
  else skeleton.setSkin(skinName)
  if (typeof skeleton.setToSetupPose === 'function') skeleton.setToSetupPose() else skeleton.setSlotsToSetupPose()
  skeleton.updateWorldTransform(SPINE.Physics.update)
  const bounds = skeleton.getBoundsRect()
  const state = new SPINE.AnimationState(new SPINE.AnimationStateData(skeletonData))
  state.setAnimation(0, animName, true)
  state.update(t)
  state.apply(skeleton)
  skeleton.updateWorldTransform(SPINE.Physics.update)

  const renderer = new SPINE.SceneRenderer(canvas, cellContext)
  const cam = renderer.camera
  cam.position.x = bounds.x + bounds.width / 2
  cam.position.y = bounds.y + bounds.height / 2
  cam.zoom = Math.max(bounds.width / CELL, bounds.height / CELL) * 1.15
  cam.setViewport(CELL, CELL)
  cellContext.gl.viewport(0, 0, CELL, CELL)
  cellContext.gl.clearColor(0.86, 0.91, 0.95, 1)
  cellContext.gl.clear(cellContext.gl.COLOR_BUFFER_BIT)
  renderer.begin()
  renderer.drawSkeleton(skeleton, false)
  renderer.end()
}

async function init() {
  const dummy = document.createElement('canvas')
  const context = new SPINE.ManagedWebGLRenderingContext(dummy, { alpha: true, antialias: true })
  const skeletonData = await loadAssets(context)
  for (const [skinName, animName, t] of combos) renderCell(skeletonData, skinName, animName, t)
  setStatus('done')
}

init().catch((e) => setStatus('error: ' + String(e && e.message ? e.message : e)))
</script>
</body>
</html>
